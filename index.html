<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Game</title>
    <style>
        .envelope {
            cursor: pointer;
            display: inline-block;
            width: 120px;
            height: 200px;
            background: url('static/envelope.png') no-repeat center center;
            background-size: cover;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 200px;
            margin: 10px;
            user-select: none;
            position: relative;
        }

        .envelope span {
            visibility: hidden;
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8);
            color: black;
            font-size: 18px;
            padding: 2px 0;
        }

        .envelope.revealed span {
            visibility: visible;
        }

        .hidden {
            visibility: hidden;
        }

        .revealed {
            background-color: #ccc;
            cursor: default;
            color: black;
        }

        .firecracker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .envelope.clicked .firecracker {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Chọn Một Đi Em (ONLY ONE)</h1>
    <div id="envelope1" class="envelope">
        <span>$50</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope2" class="envelope">
        <span>$45</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope3" class="envelope">
        <span>$40</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope4" class="envelope">
        <span>$35</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope5" class="envelope">
        <span>$30</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <p id="result" style="font-size: 24px;"></p>

    <script>
        let amounts = [50, 45, 40, 35, 30];

        // Shuffle the amounts for randomness
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffle(amounts);

        // Check if the user already selected an envelope
        const selectedEnvelope = localStorage.getItem('selectedEnvelope');
        const storedMessage = localStorage.getItem('resultMessage');
        if (selectedEnvelope && storedMessage) {
            revealEnvelopes(selectedEnvelope, storedMessage);
        }

        function revealEnvelopes(index, message) {
            const envelopes = document.querySelectorAll('.envelope');
            const result = document.getElementById('result');
            
            envelopes.forEach((env, i) => {
                const span = env.querySelector('span');
                const firecracker = env.querySelector('.firecracker');
                span.textContent = "$" + amounts[i];
                if (i === parseInt(index)) {
                    result.textContent = message;
                    env.classList.add('clicked');
                    firecracker.style.display = 'block';
                    setTimeout(() => {
                        firecracker.style.display = 'none';
                    }, 2000);
                }
                env.classList.add('revealed');
                span.style.visibility = 'visible';
            });
        }

        function openEnvelope(index) {
            if (localStorage.getItem('selectedEnvelope')) {
                alert("=,= BỚT ĂN GIAN LẠI! =,=");
                return;
            }

            const message = "Cho Em $" + amounts[index] + ". Năm mới vui vẻ, chúc em bình yên, thành công, và bớt lì bớt cãi lại :)))";
            localStorage.setItem('selectedEnvelope', index); // Store the selected envelope
            localStorage.setItem('resultMessage', message); // Store the result message
            revealEnvelopes(index, message);
        }

        document.getElementById('envelope1').onclick = () => openEnvelope(0);
        document.getElementById('envelope2').onclick = () => openEnvelope(1);
        document.getElementById('envelope3').onclick = () => openEnvelope(2);
        document.getElementById('envelope4').onclick = () => openEnvelope(3);
        document.getElementById('envelope5').onclick = () => openEnvelope(4);
    </script>
</body>
</html>
