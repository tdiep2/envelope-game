<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Game</title>
    <style>
        .envelope {
            cursor: pointer;
            display: inline-block;
            width: 120px;   /* Adjust size as needed */
            height: 200px;  /* Adjust size as needed */
            background: url('static/envelope.png') no-repeat center center;
            background-size: cover;
            color: white;   /* Consider changing if it still blends in */
            font-size: 20px;
            text-align: center;
            line-height: 200px; /* Adjust if needed */
            margin: 10px;
            user-select: none; /* Prevents text selection */
            position: relative; /* Needed for absolute positioning of the label */
        }

        .envelope span {
            position: absolute;
            width: 100%;   /* Full width of the envelope */
            bottom: 10px;  /* Positioned at the bottom */
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
            color: white;
            font-size: 16px; /* Slightly smaller text */
            text-shadow: 2px 2px 4px #000000; /* Black shadow makes it readable on lighter backgrounds */
        }
        
        .hidden {
            visibility: hidden;
        }
        .revealed {
            background-color: #ccc; /* Gray out or change appearance */
            cursor: default; /* No longer clickable */
            color: black; /* Make text visible */
        }
    </style>
</head>
<body>
    <h1>Chọn Một Đi Em (ONLY ONE)</h1>
    <div id="envelope1" class="envelope"><span>$50</span></div>
    <div id="envelope2" class="envelope"><span>$45</span></div>
    <div id="envelope3" class="envelope"><span>$40</span></div>
    <div id="envelope4" class="envelope"><span>$35</span></div>
    <div id="envelope5" class="envelope"><span>$30</span></div>
    <p id="result" style="font-size: 24px;"></p>

<script>
    // Updated array of amounts for each envelope
    const amounts = [30, 35, 40, 45, 50]; // Updated amounts

    // Shuffle the amounts for randomness
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffle(amounts);

    // Function to open an envelope and reveal all
    function openEnvelope(selectedIndex) {
        const envelopes = document.querySelectorAll('.envelope');
        envelopes.forEach((env, index) => {
            // Commenting out to allow multiple interactions during testing
            // env.onclick = null; // Disable further clicks
            if (index === selectedIndex) {
                const result = document.getElementById('result');
                result.textContent = "Cho Em $" + amounts[index] + ". Sinh nhật vui vẻ, thêm tuổi mới xinh đẹp, và bớt lì lại :)))";
            } else {
                env.textContent = "$" + amounts[index]; // Show amount in other envelopes
            }
            env.classList.add('revealed'); // Change style to indicate it's been revealed
        });
    }

    document.getElementById('envelope1').onclick = () => openEnvelope(0);
    document.getElementById('envelope2').onclick = () => openEnvelope(1);
    document.getElementById('envelope3').onclick = () => openEnvelope(2);
    document.getElementById('envelope4').onclick = () => openEnvelope(3);
    document.getElementById('envelope5').onclick = () => openEnvelope(4);
</script>
</body>
</html>
