<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Game</title>
    <style>
        .envelope {
            cursor: pointer;
            display: inline-block;
            width: 120px;   /* Adjust size as needed */
            height: 200px;  /* Adjust size as needed */
            background: url('static/envelope.png') no-repeat center center;
            background-size: cover;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 200px; /* Adjust if needed */
            margin: 10px;
            user-select: none; /* Prevents text selection */
        }
        .hidden {
            visibility: hidden;
        }
    </style>
</head>
<body>
    <h1>Chọn Một Đi Em (ONLY ONE)</h1>
    <div id="envelope1" class="envelope">Envelope 1</div>
    <div id="envelope2" class="envelope">Envelope 2</div>
    <div id="envelope3" class="envelope">Envelope 3</div>
    <div id="envelope4" class="envelope">Envelope 4</div> <!-- New envelope -->
    <div id="envelope5" class="envelope">Envelope 5</div> <!-- New envelope -->
    <p id="result" style="font-size: 24px;"></p>

    <script>
        // Updated array of amounts for each envelope
        const amounts = [30, 35, 40, 45, 50]; // Updated amounts
    
        // Shuffle the amounts for randomness
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
    
        shuffle(amounts);
    
        // Function to open an envelope
        function openEnvelope(index) {
            /* Uncomment for production to limit to one pick
            if (localStorage.getItem('picked')) {
                alert("Bớt Cheating Lại =,=");
                return;
            }
            */
    
            const result = document.getElementById('result');
            result.textContent = "Cho Em $" + amounts[index] + " sinh nhật vui vẻ, thêm tuổi mới xinh đẹp, và bớt lì lại :)))";
            /* Uncomment for production to save the pick state
            localStorage.setItem('picked', true);
            */
    
            // Disable all envelopes after one is opened
            document.querySelectorAll('.envelope').forEach(env => {
                env.classList.add('hidden');
            });
        }
    
        document.getElementById('envelope1').onclick = () => openEnvelope(0);
        document.getElementById('envelope2').onclick = () => openEnvelope(1);
        document.getElementById('envelope3').onclick = () => openEnvelope(2);
        document.getElementById('envelope4').onclick = () => openEnvelope(3); // New envelope interaction
        document.getElementById('envelope5').onclick = () => openEnvelope(4); // New envelope interaction
    </script>
</body>
</html>
