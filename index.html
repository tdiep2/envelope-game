<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Game</title>
    <style>
        .envelope {
            cursor: pointer;
            display: inline-block;
            width: 120px;   /* Adjust size as needed */
            height: 200px;  /* Adjust size as needed */
            background: url('static/envelope.png') no-repeat center center;
            background-size: cover;
            color: white;   /* Consider changing if it still blends in */
            font-size: 20px;
            text-align: center;
            line-height: 200px; /* Adjust if needed */
            margin: 10px;
            user-select: none; /* Prevents text selection */
            position: relative; /* Needed for absolute positioning of the label */
        }

        .envelope span {
            visibility: hidden; /* Start with hidden money amounts */
            position: absolute;
            bottom: 10px; /* Position at the bottom of the envelope */
            width: 100%;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8); /* Light background for readability */
            color: black; /* Ensure text is readable */
            font-size: 18px; /* Adjust size as needed */
            padding: 2px 0; /* Padding for visual comfort */
        }

        .envelope.revealed span {
            visibility: visible; /* Make visible when revealed */
        }

        .hidden {
            visibility: hidden;
        }

        .revealed {
            background-color: #ccc; /* Gray out or change appearance */
            cursor: default; /* No longer clickable */
            color: black; /* Make text visible */
        }

        .firecracker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden by default */
        }

        .envelope.clicked .firecracker {
            display: block; /* Show firecracker on click */
        }
    </style>
</head>
<body>
    <h1>Chọn Một Đi Em (ONLY ONE)</h1>
    <div id="envelope1" class="envelope">
        <span>$50</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope2" class="envelope">
        <span>$45</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope3" class="envelope">
        <span>$40</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope4" class="envelope">
        <span>$35</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>
    <div id="envelope5" class="envelope">
        <span>$30</span>
        <img src="static/firecracker.gif" alt="Firecracker" class="firecracker">
    </div>    
    <p id="result" style="font-size: 24px;"></p>

    <script>
        let amounts = [50, 45, 40, 35, 30]; // Set fixed amounts for clarity
    
        // Shuffle the amounts for randomness
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]]; // Swap elements
            }
        }
    
        // Ensure the shuffle function is called each time the script runs
        shuffle(amounts);
    
        function openEnvelope(index) {
            const envelopes = document.querySelectorAll('.envelope');
            const result = document.getElementById('result');
            
            envelopes.forEach((env, i) => {
                const span = env.querySelector('span');
                const firecracker = env.querySelector('.firecracker');
                if (i === index) {
                    result.textContent = "Cho Em $" + amounts[i] + ". Sinh nhật vui vẻ, thêm tuổi mới xinh đẹp, và bớt lì lại :)))";
                    env.classList.add('clicked'); // Add clicked class to trigger firecracker
                    firecracker.style.display = 'block'; // Show the firecracker gif
                    setTimeout(() => {
                        firecracker.style.display = 'none'; // Hide firecracker after animation
                    }, 2000); // Adjust time based on your gif duration
                }
                span.textContent = "$" + amounts[i]; // Show shuffled amount
                env.classList.add('revealed'); // Reveal all envelopes
                span.style.visibility = 'visible'; // Make the span visible
            });
        }
    
        document.getElementById('envelope1').onclick = () => openEnvelope(0);
        document.getElementById('envelope2').onclick = () => openEnvelope(1);
        document.getElementById('envelope3').onclick = () => openEnvelope(2);
        document.getElementById('envelope4').onclick = () => openEnvelope(3);
        document.getElementById('envelope5').onclick = () => openEnvelope(4);
    </script>
</body>
</html>
